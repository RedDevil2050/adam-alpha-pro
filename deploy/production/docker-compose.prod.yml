version: '3.8'

services:
  # Main Application
  zion-backend:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.prod
    container_name: zion-backend-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=false
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://zion_user:${DB_PASSWORD}@postgres:5432/zion_prod
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ALPHA_VANTAGE_KEY=${ALPHA_VANTAGE_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - ALLOWED_ORIGINS=https://zion.yourdomain.com,https://www.zion.yourdomain.com
    volumes:
      - app-logs:/app/logs
      - static-files:/app/static
    depends_on:
      - postgres
      - redis
    networks:
      - zion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  zion-frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/production/Dockerfile.frontend
    container_name: zion-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=https://api.zion.yourdomain.com
      - REACT_APP_ENV=production
    volumes:
      - frontend-build:/usr/share/nginx/html
    networks:
      - zion-network
    depends_on:
      - zion-backend

  # Database
  postgres:
    image: postgres:15-alpine
    container_name: zion-postgres-prod
    restart: unless-stopped
    environment:
      - POSTGRES_DB=zion_prod
      - POSTGRES_USER=zion_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - zion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zion_user -d zion_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: zion-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - zion-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: zion-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
      - static-files:/var/www/static
      - frontend-build:/var/www/html
    depends_on:
      - zion-backend
      - zion-frontend
    networks:
      - zion-network

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: zion-prometheus-prod
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - zion-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: zion-grafana-prod
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - zion-network

volumes:
  postgres-data:
  redis-data:
  app-logs:
  static-files:
  frontend-build:
  prometheus-data:
  grafana-data:

networks:
  zion-network:
    driver: bridge
